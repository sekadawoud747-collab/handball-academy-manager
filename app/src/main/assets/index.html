<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>Handball Academy Manager</title>

<style>
:root{--navy:#102a43;--blue:#1f6feb;--pale:#eaf2f8;--bg:#f3f6fa;--ink:#142333;--muted:#64748b;--green:#16845b;--red:#c0392b;--amber:#a96500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--navy);color:white}.secondary{background:var(--pale);color:var(--navy)}.danger{background:#feeceb;color:var(--red)}.success{background:#e4f6ee;color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.appbar{background:var(--navy);color:white;padding:18px 16px 24px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.ball{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:30px}.appbar h1{font-size:18px;margin:0}.appbar p{font-size:12px;margin:4px 0 0;color:#d6e4f0}.appbar .topline{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #102a430c}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f7f9fc;border:1px solid #edf1f5;border-radius:14px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:11px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf0;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:150px;background:transparent;color:var(--muted);font-size:12px;padding:8px 3px}.nav button.active{background:var(--pale);color:var(--navy)}.player{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.player:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-weight:800;color:var(--navy)}.playerinfo{flex:1;min-width:0}.playerinfo strong{display:block;font-size:14px}.playerinfo small{color:var(--muted)}.statusbtn{padding:8px 9px;font-size:12px;min-width:67px}.present{background:#e3f6ed;color:var(--green)}.absent{background:#ffebea;color:var(--red)}.excused{background:#fff2d9;color:var(--amber)}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#edf2f7;font-size:11px;color:var(--navy)}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.hidden{display:none!important}.notice{background:#fff5d9;border:1px solid #f5df9d;color:#795000;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.6}.login{max-width:430px;margin:28px auto;padding:0 16px}.login .card{padding:22px}.loginlogo{text-align:center;padding:18px 0}.loginlogo .ball{margin:0 auto 10px;width:72px;height:72px;font-size:42px}.loginlogo h1{font-size:21px;margin:0}.loginlogo p{margin:5px;color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{margin:0}.reportrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}.reportrow:last-child{border:0}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:20;background:#142333;color:white;border-radius:12px;padding:13px;text-align:center;box-shadow:0 8px 30px #0002}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
@media(min-width:600px){.wrap{padding-top:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.appbar{padding-left:max(20px,calc((100% - 730px)/2));padding-right:max(20px,calc((100% - 730px)/2))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDivjBuzpt5QmLJdphXkWMllc1khoHa8I8",
  authDomain: "handball-academy-manager-fe8e4.firebaseapp.com",
  projectId: "handball-academy-manager-fe8e4",
  storageBucket: "handball-academy-manager-fe8e4.firebasestorage.app",
  messagingSenderId: "142024172167",
  appId: "1:142024172167:web:ae1e592810f87b09094e22",
  measurementId: "G-VKM3WMPDJ3"
};
let fbApp, auth, store, cloudFunctions, cloudReady=false, syncingRemote=false, unsubs=[];
try { fbApp=firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); store=firebase.firestore(); cloudFunctions=firebase.functions(); cloudReady=true; } catch(e) { console.error('Firebase init failed',e); }
const KEY='ham_v2_data', SESSION='ham_v2_session';
const initial={teams:[{id:'t1',name:'مواليد 2015 بنين',coachId:'c1'},{id:'t2',name:'مواليد 2014 بنات',coachId:'c2'}],coaches:[{id:'c1',name:'كابتن أحمد',phone:'01000000001',password:'1234',teamId:'t1'},{id:'c2',name:'كابتن منى',phone:'01000000002',password:'1234',teamId:'t2'}],players:[{id:'p1',name:'محمد أحمد',teamId:'t1',number:'7'},{id:'p2',name:'عمر محمود',teamId:'t1',number:'10'},{id:'p3',name:'يوسف علي',teamId:'t1',number:'11'},{id:'p4',name:'سلمى حسن',teamId:'t2',number:'4'},{id:'p5',name:'ملك أحمد',teamId:'t2',number:'8'}],attendance:{},manager:{phone:'01000000000',password:'1234'}};
let db=loadDB(), session=JSON.parse(localStorage.getItem(SESSION)||'null'), tab='home', chosenTeam='', chosenDate=today();
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.teams?d:structuredClone(initial)}catch(e){return JSON.parse(JSON.stringify(initial))}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));syncToCloud()}
function today(){return new Date().toLocaleDateString('en-CA')}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function teamById(tid){return db.teams.find(t=>t.id===tid)}
function coach(){if(session?.role==='coach')return {id:session.uid||session.id,name:session.name||'',teamId:session.teamId||''};return db.coaches.find(c=>c.id===session?.id)}
function visibleTeams(){return session?.role==='manager'?db.teams:db.teams.filter(t=>t.id===coach()?.teamId)}
function visiblePlayers(tid){return db.players.filter(p=>p.teamId===tid)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
async function login(email,password,role){
 if(!cloudReady){toast('الاتصال بـ Firebase فشل. تأكد من الإنترنت وإعدادات المشروع.');return}
 email=String(email||'').trim();
 if(!email||!password){toast('اكتب البريد الإلكتروني وكلمة المرور');return}
 try {
   const cred=await auth.signInWithEmailAndPassword(email,password);
   let snap=await store.collection('users').doc(cred.user.uid).get();
   if(!snap.exists){
     try {
       await cloudFunctions.httpsCallable('repairMyProfile')({});
       snap=await store.collection('users').doc(cred.user.uid).get();
     } catch(repairError) { console.warn('Profile repair skipped',repairError); }
   }
   if(!snap.exists){await auth.signOut();toast('الحساب موجود لكن ملف الصلاحيات غير موجود. انشر دوال Firebase وتأكد من مستند users المطابق للحساب.');return}
   const profile=snap.data();
   if(profile.active!==true || !['manager','coach'].includes(profile.role)){await auth.signOut();toast('الحساب موقوف أو صلاحياته غير صحيحة');return}
   localStorage.setItem('ham_last_email',email);
   session={id:cred.user.uid,uid:cred.user.uid,name:profile.name||email,role:profile.role,teamId:profile.teamId||'',email};
   localStorage.setItem(SESSION,JSON.stringify(session));
   tab='home'; await startCloudSync(); render();
 } catch(e){console.error(e);toast(firebaseError(e));}
}
function firebaseError(e){const c=e&&e.code||'';if(c.includes('wrong-password')||c.includes('invalid-credential')||c.includes('user-not-found'))return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';if(c.includes('network'))return 'مفيش اتصال بالإنترنت';if(c.includes('too-many-requests'))return 'محاولات كثيرة. استنى شوية وجرب تاني';return 'تعذر تسجيل الدخول: '+(e&&e.message?e.message:c)}
let authMode='login', bootstrapStatusChecked=false;
async function detectFirstRun(){if(!cloudReady||!cloudFunctions){authMode='login';bootstrapStatusChecked=true;render();return}try{const result=await cloudFunctions.httpsCallable('getBootstrapStatus')({});authMode=result.data&&result.data.initialized?'login':'register'}catch(e){console.error('Bootstrap status unavailable',e);authMode='login'}bootstrapStatusChecked=true;render()}
function switchAuthMode(mode){if(mode==='register'&&authMode!=='register')return;authMode=mode;render()}
async function registerFirstManager(){const name=document.getElementById('regName')?.value.trim()||'',email=document.getElementById('regEmail')?.value.trim()||'',password=document.getElementById('regPassword')?.value||'';if(!name||!email||password.length<6)return toast('اكتب الاسم والبريد وكلمة مرور 6 أحرف على الأقل');if(!cloudReady||!cloudFunctions)return toast('خدمة التسجيل غير جاهزة؛ انشر دوال Firebase أولاً');try{await cloudFunctions.httpsCallable('bootstrapManager')({name,email,password});authMode='login';localStorage.setItem('ham_last_email',email);render();const input=document.getElementById('phone');if(input)input.value=email;toast('تم إنشاء حساب المدير. سجّل دخولك الآن بنفس البريد وكلمة المرور.')}catch(e){console.error('First manager registration failed',e);const msg=e?.message||'';if((e?.code||'').includes('already-exists')||msg.includes('already-exists')||msg.includes('already exists')||msg.includes('تم إعداد حساب المدير بالفعل')){authMode='login';render();toast('تم إعداد حساب المدير من قبل. سجّل الدخول.')}else toast('فشل إنشاء الحساب: '+msg)}}
async function startCloudSync(){
 stopCloudSync(); if(!session||!cloudReady)return;
 const role=session.role, uid=session.uid;
 if(role==='manager'){try{const existing=await store.collection('teams').limit(1).get();if(existing.empty){const b=store.batch();db.teams=initial.teams.map(t=>({...t,coachId:''}));db.players=initial.players.map(p=>({...p}));db.teams.forEach(t=>{const {id,...data}=t;b.set(store.collection('teams').doc(id),data)});db.players.forEach(p=>{const {id,...data}=p;b.set(store.collection('players').doc(id),data)});await b.commit();}}catch(e){console.error('Initial seed skipped',e)}}
 const attach=(col,handler,query=null)=>{const ref=query||store.collection(col);unsubs.push(ref.onSnapshot(snap=>{if(!session||session.uid!==uid)return;handler(snap);},err=>{console.error(col,err);toast('مشكلة في قراءة '+col+'؛ راجع صلاحيات Firestore') }))};
 if(role==='manager')attach('teams',snap=>{syncingRemote=true;db.teams=snap.docs.map(d=>({id:d.id,...d.data()}));finishRemoteSync()});
 else attach('teams',snap=>{syncingRemote=true;db.teams=snap.docs.map(d=>({id:d.id,...d.data()}));finishRemoteSync()},store.collection('teams').where(firebase.firestore.FieldPath.documentId(),'==',session.teamId));
 if(role==='manager')attach('players',snap=>{syncingRemote=true;db.players=snap.docs.map(d=>({id:d.id,...d.data()}));finishRemoteSync()});
 else attach('players',snap=>{syncingRemote=true;db.players=snap.docs.map(d=>({id:d.id,...d.data()}));finishRemoteSync()},store.collection('players').where('teamId','==',session.teamId));
 attach('attendance',snap=>{syncingRemote=true;const a={};snap.docs.forEach(d=>{const x=d.data();const key=x.date+'_'+x.playerId;a[key]={status:x.status,teamId:x.teamId,updatedAt:x.updatedAt&&x.updatedAt.toDate?x.updatedAt.toDate().toISOString():new Date().toISOString()}});db.attendance=a;finishRemoteSync()},role==='manager'?null:store.collection('attendance').where('teamId','==',session.teamId));
 if(role==='manager')attach('users',snap=>{syncingRemote=true;db.coaches=snap.docs.filter(d=>d.data().role==='coach'&&d.data().active!==false).map(d=>({id:d.id,uid:d.id,name:d.data().name||'',email:d.data().email||'',phone:d.data().phone||'',teamId:d.data().teamId||''}));finishRemoteSync()});
}
function finishRemoteSync(){localStorage.setItem(KEY,JSON.stringify(db));setTimeout(()=>{syncingRemote=false;render()},80)}
function stopCloudSync(){unsubs.forEach(fn=>{try{fn()}catch(e){}});unsubs=[]}
async function syncToCloud(){
 if(!cloudReady||!session||syncingRemote)return;
 try{
   const batch=store.batch();
   if(session.role==='manager'){
     db.teams.forEach(t=>{const {id,...data}=t;batch.set(store.collection('teams').doc(id),data,{merge:true})});
     db.players.forEach(p=>{const {id,...data}=p;batch.set(store.collection('players').doc(id),data,{merge:true})});
   }
   Object.entries(db.attendance).forEach(([key,a])=>{const parts=key.split('_'),playerId=parts.pop(),date=parts.join('_');if(session.role==='coach'&&a.teamId!==session.teamId)return;batch.set(store.collection('attendance').doc(key),{date,playerId,teamId:a.teamId,status:a.status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})});
   await batch.commit();
 }catch(e){console.error(e);toast('لم تتم المزامنة: راجع صلاحيات Firestore');}
}
async function logout(){stopCloudSync();if(auth){try{await auth.signOut()}catch(e){}}session=null;localStorage.removeItem(SESSION);render()}
function render(){const root=document.getElementById('app');if(!session){const lastEmail=esc(localStorage.getItem('ham_last_email')||'');if(!bootstrapStatusChecked){root.innerHTML=`<div class="login"><div class="loginlogo"><div class="ball">🤾</div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد والحضور</p></div><div class="card"><h2>جاري تجهيز شاشة الحساب…</h2><p class="small muted">لحظة واحدة.</p></div></div>`;return}if(authMode==='register'){root.innerHTML=`<div class="login"><div class="loginlogo"><div class="ball">🤾</div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد والحضور</p></div><div class="card"><h2>إنشاء حساب المدير لأول مرة</h2><p class="small muted">الشاشة دي تظهر مرة واحدة فقط عند إعداد الأكاديمية لأول مرة.</p><div class="field"><label>اسم المدير</label><input id="regName" autocomplete="name" placeholder="الاسم بالكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="regPassword" type="password" autocomplete="new-password" placeholder="أنشئ كلمة مرور قوية"></div><button class="primary" style="width:100%" onclick="registerFirstManager()">إنشاء حساب الأكاديمية</button><div class="notice" style="margin-top:14px">بعد إنشاء الحساب، ستظهر شاشة تسجيل الدخول. لا تشارك كلمة المرور مع أي شخص.</div></div><p class="foot">HANDball ACADEMY MANAGER · OFFICIAL APP</p></div>`;return}root.innerHTML=`<div class="login"><div class="loginlogo"><div class="ball">🤾</div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد والحضور</p></div><div class="card"><h2>تسجيل الدخول</h2><div class="field"><label>البريد الإلكتروني</label><input id="phone" type="email" autocomplete="username" placeholder="name@example.com" value="${lastEmail}"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><button class="primary" style="width:100%" onclick="login(document.getElementById('phone').value,document.getElementById('password').value)">دخول</button><div class="notice" style="margin-top:14px">استخدم البريد وكلمة المرور اللذين أنشأتهما لحساب الأكاديمية.</div></div><p class="foot">HANDball ACADEMY MANAGER · OFFICIAL APP</p></div>`;return}
const isManager=session.role==='manager';const teams=visibleTeams();if(!chosenTeam||!teams.some(t=>t.id===chosenTeam))chosenTeam=teams[0]?.id||'';
root.innerHTML=`<header class="appbar"><div class="brand"><div class="ball">🤾</div><div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد</p></div></div><div class="topline"><span>${esc(session.name)} · ${isManager?'مدير الأكاديمية':'كابتن الفريق'}</span><button class="secondary" style="padding:7px 10px;font-size:12px" onclick="logout()">خروج</button></div></header><main class="wrap">${tab==='home'?homePage(teams,isManager):tab==='attendance'?attendancePage(teams):tab==='teams'?teamsPage():tab==='reports'?reportsPage(teams,isManager):settingsPage()}</main><nav class="nav"><button class="${tab==='home'?'active':''}" onclick="tab='home';render()">🏠<br>الرئيسية</button><button class="${tab==='attendance'?'active':''}" onclick="tab='attendance';render()">✅<br>الحضور</button>${isManager?`<button class="${tab==='teams'?'active':''}" onclick="tab='teams';render()">👥<br>الفرق</button>`:''}<button class="${tab==='reports'?'active':''}" onclick="tab='reports';render()">📊<br>التقارير</button><button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">⚙️<br>الإعدادات</button></nav>`;
}
function demoLogin(){toast('الدخول التجريبي متوقف؛ استخدم حساب Firebase الفعلي')}
function homePage(teams,isManager){let todayKey=today();let allPlayers=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let statuses=allPlayers.map(p=>db.attendance[`${todayKey}_${p.id}`]?.status);let present=statuses.filter(s=>s==='present').length,absent=statuses.filter(s=>s==='absent').length,excused=statuses.filter(s=>s==='excused').length;return `<div class="grid"><div class="stat"><strong>${teams.length}</strong><span>الفرق المسؤولة عنها</span></div><div class="stat"><strong>${allPlayers.length}</strong><span>إجمالي اللاعبين</span></div><div class="stat"><strong>${present}</strong><span>حاضر اليوم</span></div><div class="stat"><strong>${absent}</strong><span>غائب اليوم</span></div></div><div class="card"><div class="sectionhead"><h2>تسجيل الحضور</h2><span class="pill">${esc(todayKey)}</span></div><p class="muted small">اختار الفريق وسجّل حالة كل لاعب في ثواني.</p><div class="field"><label>الفريق</label><select id="homeTeam" onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===chosenTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><button class="primary" style="width:100%" onclick="tab='attendance';chosenDate=today();render()">فتح سجل الحضور</button></div><div class="card"><h2>ملخص اليوم</h2><div class="reportrow"><span>حاضر</span><strong style="color:var(--green)">${present}</strong></div><div class="reportrow"><span>غائب</span><strong style="color:var(--red)">${absent}</strong></div><div class="reportrow"><span>معتذر</span><strong style="color:var(--amber)">${excused}</strong></div><div class="reportrow"><span>لم يتم تحديد الحالة</span><strong>${statuses.filter(s=>!s).length}</strong></div></div><div class="notice">المزامنة اللحظية تعتمد على اتصال الإنترنت وصحة صلاحيات Firebase المنشورة. لو ظهر خطأ في المزامنة، راجع إعداد Firestore وقواعد الحماية.</div>`}
function attendancePage(teams){if(!teams.length)return `<div class="card empty">مفيش فريق مخصص للحساب ده.</div>`;let team=teamById(chosenTeam)||teams[0];chosenTeam=team.id;let players=visiblePlayers(team.id);return `<div class="card"><div class="sectionhead"><h2>سجل الحضور</h2><span class="pill">${players.length} لاعب</span></div><div class="field"><label>الفريق</label><select onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>تاريخ التمرين</label><input type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()"></div><div class="row"><button class="secondary" onclick="markAll('present')">الكل حاضر</button><button class="secondary" onclick="clearDay()">مسح الحالات</button></div>${players.length?players.map((p,i)=>{let s=db.attendance[`${chosenDate}_${p.id}`]?.status;return `<div class="player"><div class="avatar">${esc(p.number||String(i+1))}</div><div class="playerinfo"><strong>${esc(p.name)}</strong><small>${s==='present'?'حاضر':s==='absent'?'غائب':s==='excused'?'معتذر':'لم تُحدد الحالة'}</small></div><button class="statusbtn ${s==='present'?'present':''}" onclick="setStatus('${p.id}','present')">حاضر</button><button class="statusbtn ${s==='absent'?'absent':''}" onclick="setStatus('${p.id}','absent')">غائب</button><button class="statusbtn ${s==='excused'?'excused':''}" onclick="setStatus('${p.id}','excused')">معتذر</button></div>`}).join(''):`<div class="empty">مفيش لاعبين في الفريق ده. المدير يقدر يضيفهم من صفحة الفرق.</div>`}<button class="primary" style="width:100%;margin-top:14px" onclick="saveAttendance()">حفظ الحضور</button></div>`}
function setStatus(pid,status){db.attendance[`${chosenDate}_${pid}`]={status,updatedAt:new Date().toISOString(),teamId:chosenTeam};saveDB();render()}
function markAll(s){visiblePlayers(chosenTeam).forEach(p=>db.attendance[`${chosenDate}_${p.id}`]={status:s,updatedAt:new Date().toISOString(),teamId:chosenTeam});saveDB();render();toast('تم تحديد الحالات')}
async function clearDay(){if(!confirm('تمسح حالات الحضور لهذا الفريق والتاريخ؟'))return;const ids=visiblePlayers(chosenTeam).map(p=>`${chosenDate}_${p.id}`);ids.forEach(k=>delete db.attendance[k]);saveDB();if(cloudReady&&session){try{await Promise.all(ids.map(k=>store.collection('attendance').doc(k).delete()))}catch(e){console.error(e);toast('لم يتم مسح كل الحالات من السحابة؛ راجع الصلاحيات')}}render()}
function saveAttendance(){saveDB();toast('تم حفظ الحضور وإرسال المزامنة')}
function teamsPage(){return `<div class="card"><h2>إدارة الفرق واللاعبين</h2><p class="muted small">أضف فريق أو لاعب، ثم عيّن الكابتن المسؤول عن الفريق.</p><div class="field"><label>اسم الفريق الجديد</label><input id="newTeamName" placeholder="مثال: مواليد 2016 بنين"></div><button class="primary" onclick="addTeam()">إضافة فريق</button></div><div class="card"><h2>الفرق الحالية</h2>${db.teams.map(t=>`<div class="reportrow" style="align-items:center"><div><strong>${esc(t.name)}</strong><div class="small muted">${visiblePlayers(t.id).length} لاعب · ${esc(db.coaches.find(c=>c.id===t.coachId)?.name||'بدون كابتن')}</div></div><button class="secondary" onclick="chosenTeam='${t.id}';tab='teams';renderAddPlayer('${t.id}')">إضافة لاعب</button></div>`).join('')||'<div class="empty">لسه مفيش فرق</div>'}</div><div class="card"><h2>إضافة لاعب</h2><div class="field"><label>الفريق</label><select id="playerTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>اسم اللاعب</label><input id="playerName" placeholder="الاسم بالكامل"></div><div class="field"><label>رقم اللاعب (اختياري)</label><input id="playerNumber" inputmode="numeric" placeholder="رقم القميص"></div><button class="primary" onclick="addPlayer()">حفظ اللاعب</button></div><div class="card"><h2>حسابات الكباتن</h2><div class="field"><label>اسم الكابتن</label><input id="coachName" placeholder="اسم الكابتن"></div><div class="field"><label>البريد الإلكتروني للدخول</label><input id="coachEmail" type="email" placeholder="coach@example.com"></div><div class="field"><label>رقم الموبايل (اختياري)</label><input id="coachPhone" inputmode="tel" placeholder="رقم الموبايل"></div><div class="field"><label>كلمة مرور مؤقتة</label><input id="coachPassword" placeholder="٤ أرقام أو أكثر"></div><div class="field"><label>الفريق المسؤول عنه</label><select id="coachTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button class="primary" onclick="addCoach()">إنشاء حساب كابتن</button><p class="small muted">إنشاء الحسابات عبر Firebase يحتاج نشر الدالة الآمنة المرفقة في مجلد functions.</p>${db.coaches.map(c=>`<div class="reportrow"><span>${esc(c.name)}<br><small class="muted">${esc(c.phone)} · ${esc(teamById(c.teamId)?.name||'بدون فريق')}</small></span><button class="danger" onclick="deleteCoach('${c.id}')">حذف</button></div>`).join('')}</div>`}
function renderAddPlayer(tid){render()}
function addTeam(){let name=document.getElementById('newTeamName').value.trim();if(!name)return toast('اكتب اسم الفريق');db.teams.push({id:id(),name,coachId:''});saveDB();render();toast('تمت إضافة الفريق')}
function addPlayer(){let name=document.getElementById('playerName').value.trim(),teamId=document.getElementById('playerTeam').value,number=document.getElementById('playerNumber').value.trim();if(!name||!teamId)return toast('اكتب اسم اللاعب واختار الفريق');db.players.push({id:id(),name,teamId,number});saveDB();render();toast('تمت إضافة اللاعب')}
async function addCoach(){let name=document.getElementById('coachName').value.trim(),email=document.getElementById('coachEmail').value.trim(),password=document.getElementById('coachPassword').value,phone=document.getElementById('coachPhone').value.trim(),teamId=document.getElementById('coachTeam').value;if(!name||!email||password.length<6||!teamId)return toast('اكتب الاسم والبريد وكلمة مرور 6 أحرف على الأقل واختار الفريق');try{const call=cloudFunctions.httpsCallable('createCoach');await call({name,email,password,phone,teamId});toast('تم إنشاء حساب الكابتن. يقدر يدخل بالبريد وكلمة المرور المحددين.')}catch(e){console.error(e);toast('إنشاء الحساب يحتاج نشر Cloud Function createCoach أولًا')}}
async function deleteCoach(cid){if(!confirm('تحذف حساب الكابتن؟'))return;try{await cloudFunctions.httpsCallable('deleteCoach')({uid:cid});toast('تم حذف حساب الكابتن')}catch(e){console.error(e);toast('حذف الحساب يحتاج نشر Cloud Function deleteCoach أولًا')}}
function reportsPage(teams,isManager){let players=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let total=0;let rows=players.map(p=>{let entries=Object.entries(db.attendance).filter(([k,v])=>k.endsWith('_'+p.id));let pr=entries.filter(([k,v])=>v.status==='present').length,ab=entries.filter(([k,v])=>v.status==='absent').length,ex=entries.filter(([k,v])=>v.status==='excused').length;total+=entries.length;return `<div class="reportrow"><div><strong>${esc(p.name)}</strong><div class="small muted">${esc(teamById(p.teamId)?.name||'')}</div><div class="small">حاضر ${pr} · غائب ${ab} · معتذر ${ex}</div></div><strong>${entries.length?Math.round(pr/entries.length*100):0}%</strong></div>`});return `<div class="card"><h2>تقارير الحضور</h2><div class="grid"><div class="stat"><strong>${players.length}</strong><span>لاعب</span></div><div class="stat"><strong>${total}</strong><span>سجلات حالات</span></div></div>${rows.join('')||'<div class="empty">لا توجد بيانات بعد</div>'}<button class="primary" style="width:100%;margin-top:12px" onclick="exportCSV()">تصدير التقرير CSV</button></div>`}
function settingsPage(){return `<div class="card"><h2>الإعدادات والنسخ الاحتياطي</h2><p class="muted">احفظ نسخة احتياطية من بيانات التجربة، أو استرجع نسخة محفوظة قبل كده.</p><button class="primary" style="width:100%" onclick="backup()">تنزيل نسخة احتياطية</button><div class="field"><label>استرجاع نسخة JSON</label><input type="file" id="restoreFile" accept=".json,application/json"></div><button class="secondary" style="width:100%" onclick="restore()">استرجاع البيانات</button><button class="danger" style="width:100%;margin-top:10px" onclick="resetDemo()">إعادة بيانات التجربة الافتراضية</button><div class="notice" style="margin-top:14px">البيانات تُزامن عبر Firebase عند الاتصال بالإنترنت. تسجيل الدخول يتطلب حسابًا مفعلًا وصلاحيات صحيحة في Firestore.</div><p class="foot">Handball Academy Manager · إصدار تجريبي 2</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'handball-backup.json')}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return toast('اختار ملف النسخة الاحتياطية');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.players||!x.attendance)throw 0;db=x;saveDB();render();toast('تم استرجاع النسخة')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function resetDemo(){toast('إعادة البيانات الافتراضية متوقفة في النسخة المتصلة بالسحابة لتجنب مسح بيانات الأكاديمية')}
function exportCSV(){let lines=[['اللاعب','الفريق','التاريخ','الحالة']];Object.entries(db.attendance).forEach(([key,v])=>{let parts=key.split('_'),pid=parts.pop(),date=parts.join('_'),p=db.players.find(x=>x.id===pid);if(p&&(!session||session.role==='manager'||p.teamId===coach()?.teamId))lines.push([p.name,teamById(p.teamId)?.name||'',date,v.status==='present'?'حاضر':v.status==='absent'?'غائب':'معتذر'])});let csv='\ufeff'+lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'attendance-report.csv')}
function download(blob,name){if(window.AndroidFileBridge&&typeof window.AndroidFileBridge.saveFile==='function'){const reader=new FileReader();reader.onload=()=>{try{const data=String(reader.result||'').split(',')[1]||'';window.AndroidFileBridge.saveFile(name,blob.type||'application/octet-stream',data)}catch(e){toast('تعذر تجهيز الملف للحفظ')}};reader.onerror=()=>toast('تعذر قراءة الملف للحفظ');reader.readAsDataURL(blob);return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

if(session&&cloudReady){session=null;localStorage.removeItem(SESSION)}
render();
detectFirstRun();
</script>
</body>
