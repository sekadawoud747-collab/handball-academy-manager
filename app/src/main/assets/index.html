<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>Handball Academy Manager</title>

<style>
:root{--navy:#673ab7;--blue:#673ab7;--pale:#f1eafa;--bg:#f6f4f9;--ink:#202124;--muted:#5f6368;--green:#188038;--red:#d93025;--amber:#b06000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--navy);color:white}.secondary{background:var(--pale);color:var(--navy)}.danger{background:#feeceb;color:var(--red)}.success{background:#e4f6ee;color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.appbar{background:var(--navy);color:white;padding:18px 16px 24px;border-top:8px solid #a98bdf;border-radius:0 0 18px 18px}.brand{display:flex;align-items:center;gap:12px}.ball{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:30px}.appbar h1{font-size:18px;margin:0}.appbar p{font-size:12px;margin:4px 0 0;color:#d6e4f0}.appbar .topline{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:white;border:1px solid #dadce0;border-top:5px solid #673ab7;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 1px 3px #0000000a}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f7f9fc;border:1px solid #edf1f5;border-radius:14px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #dadce0;border-radius:7px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf0;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:150px;background:transparent;color:var(--muted);font-size:12px;padding:8px 3px}.nav button.active{background:var(--pale);color:var(--navy)}.player{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.player:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-weight:800;color:var(--navy)}.playerinfo{flex:1;min-width:0}.playerinfo strong{display:block;font-size:14px}.playerinfo small{color:var(--muted)}.statusbtn{padding:8px 9px;font-size:12px;min-width:67px}.present{background:#e3f6ed;color:var(--green)}.absent{background:#ffebea;color:var(--red)}.excused{background:#fff2d9;color:var(--amber)}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#edf2f7;font-size:11px;color:var(--navy)}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.hidden{display:none!important}.notice{background:#fff5d9;border:1px solid #f5df9d;color:#795000;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.6}.login{max-width:430px;margin:28px auto;padding:0 16px}.login .card{padding:22px}.loginlogo{text-align:center;padding:18px 0}.loginlogo .ball{margin:0 auto 10px;width:72px;height:72px;font-size:42px}.loginlogo h1{font-size:21px;margin:0}.loginlogo p{margin:5px;color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{margin:0}.reportrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}.reportrow:last-child{border:0}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:20;background:#142333;color:white;border-radius:12px;padding:13px;text-align:center;box-shadow:0 8px 30px #0002}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
@media(min-width:600px){.wrap{padding-top:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.appbar{padding-left:max(20px,calc((100% - 730px)/2));padding-right:max(20px,calc((100% - 730px)/2))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='ham_v2_data', SESSION='ham_v2_session';
const initial={teams:[{id:'t1',name:'مواليد 2015 بنين',coachId:'c1'},{id:'t2',name:'مواليد 2014 بنات',coachId:'c2'}],coaches:[{id:'c1',name:'كابتن أحمد',phone:'01000000001',password:'1234',teamId:'t1'},{id:'c2',name:'كابتن منى',phone:'01000000002',password:'1234',teamId:'t2'}],players:[{id:'p1',name:'محمد أحمد',teamId:'t1',number:'7'},{id:'p2',name:'عمر محمود',teamId:'t1',number:'10'},{id:'p3',name:'يوسف علي',teamId:'t1',number:'11'},{id:'p4',name:'سلمى حسن',teamId:'t2',number:'4'},{id:'p5',name:'ملك أحمد',teamId:'t2',number:'8'}],attendance:{},manager:{phone:'01000000000',password:'1234'}};
let db=loadDB(), session=JSON.parse(localStorage.getItem(SESSION)||'null'), tab='home', chosenTeam='', chosenDate=today();
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.teams?d:structuredClone(initial)}catch(e){return JSON.parse(JSON.stringify(initial))}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}

// Google Sheets sync: paste the deployed Apps Script Web App URL here.
// Until a URL is configured, the app continues to work locally.
const SHEETS_WEB_APP_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
async function syncAttendanceToSheets(playerId, date, record){
  if(!SHEETS_WEB_APP_URL || SHEETS_WEB_APP_URL.includes('PASTE_YOUR_')) return;
  const player = db.players.find(p=>p.id===playerId);
  if(!player) return;
  const payload = {
    action:'attendance',
    date,
    playerId,
    playerName:player.name,
    teamId:player.teamId,
    teamName:teamById(player.teamId)?.name || '',
    status:record.status,
    updatedAt:record.updatedAt || new Date().toISOString(),
    updatedBy:session?.name || ''
  };
  try {
    await fetch(SHEETS_WEB_APP_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
  } catch(e) {
    console.warn('Google Sheets sync failed', e);
  }
}

function today(){return new Date().toLocaleDateString('en-CA')}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function teamById(tid){return db.teams.find(t=>t.id===tid)}
function coach(){return db.coaches.find(c=>c.id===session?.id)}
function visibleTeams(){return session?.role==='manager'?db.teams:db.teams.filter(t=>t.id===coach()?.teamId)}
function visiblePlayers(tid){return db.players.filter(p=>p.teamId===tid)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
function login(phone,password,role){let found=role==='manager'?(phone===db.manager.phone&&password===db.manager.password?{id:'manager',name:'المدير',role:'manager'}:null):db.coaches.find(c=>c.phone===phone&&c.password===password)?{...db.coaches.find(c=>c.phone===phone&&c.password===password),role:'coach'}:null;if(!found){toast('رقم الموبايل أو كلمة المرور غير صحيحة');return}session=found;localStorage.setItem(SESSION,JSON.stringify(session));tab='home';render()}
function logout(){session=null;localStorage.removeItem(SESSION);render()}
function render(){const root=document.getElementById('app');if(!session){root.innerHTML=`<div class="login"><div class="loginlogo"><div class="ball">🤾</div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد والحضور</p></div><div class="card"><h2>تسجيل الدخول</h2><div class="field"><label>نوع الحساب</label><select id="role"><option value="manager">مدير الأكاديمية</option><option value="coach">كابتن الفريق</option></select></div><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" placeholder="اكتب رقم الموبايل"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" placeholder="كلمة المرور"></div><button class="primary" style="width:100%" onclick="login(document.getElementById('phone').value,document.getElementById('password').value,document.getElementById('role').value)">دخول</button><button class="secondary" style="width:100%;margin-top:8px" onclick="demoLogin()">دخول سريع للتجربة</button><div class="notice" style="margin-top:14px">نسخة تطوير تجريبية تحفظ البيانات على نفس الجهاز فقط. المزامنة بين أجهزة مختلفة تحتاج ربط خادم آمن.</div><p class="small muted">حساب المدير التجريبي: 01000000000 / 1234<br>الكابتن أحمد: 01000000001 / 1234<br>الكابتن منى: 01000000002 / 1234</p></div></div>`;return}
const isManager=session.role==='manager';const teams=visibleTeams();if(!chosenTeam||!teams.some(t=>t.id===chosenTeam))chosenTeam=teams[0]?.id||'';
root.innerHTML=`<header class="appbar"><div class="brand"><div class="ball">🤾</div><div><h1>Handball Academy Manager</h1><p>إدارة أكاديمية كرة اليد</p></div></div><div class="topline"><span>${esc(session.name)} · ${isManager?'مدير الأكاديمية':'كابتن الفريق'}</span><button class="secondary" style="padding:7px 10px;font-size:12px" onclick="logout()">خروج</button></div></header><main class="wrap">${tab==='home'?homePage(teams,isManager):tab==='attendance'?attendancePage(teams):tab==='teams'?teamsPage():tab==='reports'?reportsPage(teams,isManager):settingsPage()}</main><nav class="nav"><button class="${tab==='home'?'active':''}" onclick="tab='home';render()">🏠<br>الرئيسية</button><button class="${tab==='attendance'?'active':''}" onclick="tab='attendance';render()">✅<br>الحضور</button>${isManager?`<button class="${tab==='teams'?'active':''}" onclick="tab='teams';render()">👥<br>الفرق</button>`:''}<button class="${tab==='reports'?'active':''}" onclick="tab='reports';render()">📊<br>التقارير</button><button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">⚙️<br>الإعدادات</button></nav>`;
}
function demoLogin(){session={id:'manager',name:'المدير',role:'manager'};localStorage.setItem(SESSION,JSON.stringify(session));tab='home';render()}
function homePage(teams,isManager){let todayKey=today();let allPlayers=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let statuses=allPlayers.map(p=>db.attendance[`${todayKey}_${p.id}`]?.status);let present=statuses.filter(s=>s==='present').length,absent=statuses.filter(s=>s==='absent').length,excused=statuses.filter(s=>s==='excused').length;return `<div class="grid"><div class="stat"><strong>${teams.length}</strong><span>الفرق المسؤولة عنها</span></div><div class="stat"><strong>${allPlayers.length}</strong><span>إجمالي اللاعبين</span></div><div class="stat"><strong>${present}</strong><span>حاضر اليوم</span></div><div class="stat"><strong>${absent}</strong><span>غائب اليوم</span></div></div><div class="card"><div class="sectionhead"><h2>تسجيل الحضور</h2><span class="pill">${esc(todayKey)}</span></div><p class="muted small">اختار الفريق وسجّل حالة كل لاعب في ثواني.</p><div class="field"><label>الفريق</label><select id="homeTeam" onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===chosenTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><button class="primary" style="width:100%" onclick="tab='attendance';chosenDate=today();render()">فتح سجل الحضور</button></div><div class="card"><h2>ملخص اليوم</h2><div class="reportrow"><span>حاضر</span><strong style="color:var(--green)">${present}</strong></div><div class="reportrow"><span>غائب</span><strong style="color:var(--red)">${absent}</strong></div><div class="reportrow"><span>معتذر</span><strong style="color:var(--amber)">${excused}</strong></div><div class="reportrow"><span>لم يتم تحديد الحالة</span><strong>${statuses.filter(s=>!s).length}</strong></div></div><div class="notice">ملاحظة: يعمل الحفظ المحلي دائمًا. لمزامنة الحضور بين أجهزة الكباتن، يلزم إعداد رابط Google Sheets من سكربت جوجل داخل ملف التطبيق.</div>`}
function attendancePage(teams){if(!teams.length)return `<div class="card empty">مفيش فريق مخصص للحساب ده.</div>`;let team=teamById(chosenTeam)||teams[0];chosenTeam=team.id;let players=visiblePlayers(team.id);return `<div class="card"><div class="sectionhead"><h2>سجل الحضور</h2><span class="pill">${players.length} لاعب</span></div><div class="field"><label>الفريق</label><select onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>تاريخ التمرين</label><input type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()"></div><div class="row"><button class="secondary" onclick="markAll('present')">الكل حاضر</button><button class="secondary" onclick="clearDay()">مسح الحالات</button></div>${players.length?players.map((p,i)=>{let s=db.attendance[`${chosenDate}_${p.id}`]?.status;return `<div class="player"><div class="avatar">${esc(p.number||String(i+1))}</div><div class="playerinfo"><strong>${esc(p.name)}</strong><small>${s==='present'?'حاضر':s==='absent'?'غائب':s==='excused'?'معتذر':'لم تُحدد الحالة'}</small></div><button class="statusbtn ${s==='present'?'present':''}" onclick="setStatus('${p.id}','present')">حاضر</button><button class="statusbtn ${s==='absent'?'absent':''}" onclick="setStatus('${p.id}','absent')">غائب</button><button class="statusbtn ${s==='excused'?'excused':''}" onclick="setStatus('${p.id}','excused')">معتذر</button></div>`}).join(''):`<div class="empty">مفيش لاعبين في الفريق ده. المدير يقدر يضيفهم من صفحة الفرق.</div>`}<button class="primary" style="width:100%;margin-top:14px" onclick="saveAttendance()">حفظ الحضور</button></div>`}
function setStatus(pid,status){const rec={status,updatedAt:new Date().toISOString(),teamId:chosenTeam};db.attendance[`${chosenDate}_${pid}`]=rec;saveDB();syncAttendanceToSheets(pid,chosenDate,rec);render()}
function markAll(s){visiblePlayers(chosenTeam).forEach(p=>{const rec={status:s,updatedAt:new Date().toISOString(),teamId:chosenTeam};db.attendance[`${chosenDate}_${p.id}`]=rec;syncAttendanceToSheets(p.id,chosenDate,rec)});saveDB();render();toast('تم تحديد الحالات')}
function clearDay(){if(!confirm('تمسح حالات الحضور لهذا الفريق والتاريخ؟'))return;visiblePlayers(chosenTeam).forEach(p=>delete db.attendance[`${chosenDate}_${p.id}`]);saveDB();render()}
function saveAttendance(){saveDB();toast('تم حفظ الحضور على الجهاز')}
function teamsPage(){return `<div class="card"><h2>إدارة الفرق واللاعبين</h2><p class="muted small">أضف فريق أو لاعب، ثم عيّن الكابتن المسؤول عن الفريق.</p><div class="field"><label>اسم الفريق الجديد</label><input id="newTeamName" placeholder="مثال: مواليد 2016 بنين"></div><button class="primary" onclick="addTeam()">إضافة فريق</button></div><div class="card"><h2>الفرق الحالية</h2>${db.teams.map(t=>`<div class="reportrow" style="align-items:center"><div><strong>${esc(t.name)}</strong><div class="small muted">${visiblePlayers(t.id).length} لاعب · ${esc(db.coaches.find(c=>c.id===t.coachId)?.name||'بدون كابتن')}</div></div><button class="secondary" onclick="chosenTeam='${t.id}';tab='teams';renderAddPlayer('${t.id}')">إضافة لاعب</button></div>`).join('')||'<div class="empty">لسه مفيش فرق</div>'}</div><div class="card"><h2>إضافة لاعب</h2><div class="field"><label>الفريق</label><select id="playerTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>اسم اللاعب</label><input id="playerName" placeholder="الاسم بالكامل"></div><div class="field"><label>رقم اللاعب (اختياري)</label><input id="playerNumber" inputmode="numeric" placeholder="رقم القميص"></div><button class="primary" onclick="addPlayer()">حفظ اللاعب</button></div><div class="card"><h2>حسابات الكباتن</h2><div class="field"><label>اسم الكابتن</label><input id="coachName" placeholder="اسم الكابتن"></div><div class="field"><label>رقم الموبايل</label><input id="coachPhone" inputmode="tel" placeholder="رقم الموبايل"></div><div class="field"><label>كلمة مرور مؤقتة</label><input id="coachPassword" placeholder="٤ أرقام أو أكثر"></div><div class="field"><label>الفريق المسؤول عنه</label><select id="coachTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button class="primary" onclick="addCoach()">إنشاء حساب كابتن</button><p class="small muted">الحسابات هنا تجريبية ومحفوظة محليًا فقط، فلا تستخدم كلمات مرور حقيقية.</p>${db.coaches.map(c=>`<div class="reportrow"><span>${esc(c.name)}<br><small class="muted">${esc(c.phone)} · ${esc(teamById(c.teamId)?.name||'بدون فريق')}</small></span><button class="danger" onclick="deleteCoach('${c.id}')">حذف</button></div>`).join('')}</div>`}
function renderAddPlayer(tid){render()}
function addTeam(){let name=document.getElementById('newTeamName').value.trim();if(!name)return toast('اكتب اسم الفريق');db.teams.push({id:id(),name,coachId:''});saveDB();render();toast('تمت إضافة الفريق')}
function addPlayer(){let name=document.getElementById('playerName').value.trim(),teamId=document.getElementById('playerTeam').value,number=document.getElementById('playerNumber').value.trim();if(!name||!teamId)return toast('اكتب اسم اللاعب واختار الفريق');db.players.push({id:id(),name,teamId,number});saveDB();render();toast('تمت إضافة اللاعب')}
function addCoach(){let name=document.getElementById('coachName').value.trim(),phone=document.getElementById('coachPhone').value.trim(),password=document.getElementById('coachPassword').value.trim(),teamId=document.getElementById('coachTeam').value;if(!name||!phone||password.length<4||!teamId)return toast('كمّل بيانات الكابتن');if(db.coaches.some(c=>c.phone===phone)||phone===db.manager.phone)return toast('رقم الموبايل مستخدم بالفعل');let c={id:id(),name,phone,password,teamId};db.coaches.push(c);let t=teamById(teamId);if(t)t.coachId=c.id;saveDB();render();toast('تم إنشاء حساب الكابتن')}
function deleteCoach(cid){if(!confirm('تحذف حساب الكابتن؟'))return;db.coaches=db.coaches.filter(c=>c.id!==cid);db.teams.forEach(t=>{if(t.coachId===cid)t.coachId=''});saveDB();render()}
function reportsPage(teams,isManager){
 let players=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);
 let month=document.getElementById('reportMonth')?.value || today().slice(0,7);
 let monthEntries=Object.entries(db.attendance).map(([key,v])=>{let parts=key.split('_'),pid=parts.pop(),date=parts.join('_');return {pid,date,status:v.status,teamId:v.teamId};}).filter(e=>e.date.startsWith(month));
 let days=[...new Set(monthEntries.filter(e=>e.status==='present'||e.status==='absent'||e.status==='excused').map(e=>e.date))].sort();
 let totalPresent=0,totalAbsent=0,totalExcused=0;
 let rows=players.map(p=>{let entries=monthEntries.filter(e=>e.pid===p.id);let pr=entries.filter(e=>e.status==='present').length,ab=entries.filter(e=>e.status==='absent').length,ex=entries.filter(e=>e.status==='excused').length;totalPresent+=pr;totalAbsent+=ab;totalExcused+=ex;let absentDates=entries.filter(e=>e.status==='absent').map(e=>e.date).sort();return `<div class="reportrow"><div><strong>${esc(p.name)}</strong><div class="small muted">${esc(teamById(p.teamId)?.name||'')}</div><div class="small">حضور: ${pr} يوم · غياب: ${ab} يوم · معتذر: ${ex} يوم</div>${absentDates.length?`<div class="small" style="color:var(--red)">تواريخ الغياب: ${absentDates.map(esc).join('، ')}</div>`:''}</div><strong>${pr+ab+ex?Math.round(pr/(pr+ab+ex)*100):0}%</strong></div>`});
 return `<div class="card"><h2>الحصر الشهري للحضور والغياب</h2><div class="field"><label>اختار الشهر</label><input id="reportMonth" type="month" value="${esc(month)}" onchange="render()"></div><p class="small muted">أيام التمرين المحسوبة هي الأيام التي سُجّلت فيها حالة لاعب واحد على الأقل.</p><div class="grid"><div class="stat"><strong>${players.length}</strong><span>إجمالي اللاعبين</span></div><div class="stat"><strong>${days.length}</strong><span>أيام تمرين مسجلة</span></div><div class="stat"><strong>${totalPresent}</strong><span>حالات حضور</span></div><div class="stat"><strong>${totalAbsent}</strong><span>حالات غياب</span></div></div><div class="reportrow"><span>إجمالي حالات الاعتذار</span><strong>${totalExcused}</strong></div>${rows.join('')||'<div class="empty">لا توجد بيانات لهذا الشهر</div>'}<button class="primary" style="width:100%;margin-top:12px" onclick="exportMonthlyCSV()">تصدير حصر الشهر CSV</button><button class="secondary" style="width:100%;margin-top:8px" onclick="exportCSV()">تصدير كل السجلات CSV</button><div class="notice" style="margin-top:12px">ملاحظة: التقرير يحسب الأيام التي تم تسجيل حالتها فقط، ولا يعتبر اليوم الذي لم يُسجّل غيابًا أو حضورًا.</div></div>`
}
function settingsPage(){return `<div class="card"><h2>الإعدادات والنسخ الاحتياطي</h2><p class="muted">احفظ نسخة احتياطية من بيانات التجربة، أو استرجع نسخة محفوظة قبل كده.</p><button class="primary" style="width:100%" onclick="backup()">تنزيل نسخة احتياطية</button><div class="field"><label>استرجاع نسخة JSON</label><input type="file" id="restoreFile" accept=".json,application/json"></div><button class="secondary" style="width:100%" onclick="restore()">استرجاع البيانات</button><button class="danger" style="width:100%;margin-top:10px" onclick="resetDemo()">إعادة بيانات التجربة الافتراضية</button><div class="notice" style="margin-top:14px">النسخة الحالية تعمل بدون إنترنت بعد فتحها، لكن كل جهاز له بياناته. النسخة النهائية تحتاج خادمًا آمنًا لتزامن الحضور بين المدير والكباتن.</div><p class="foot">Handball Academy Manager · إصدار تجريبي 2</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'handball-backup.json')}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return toast('اختار ملف النسخة الاحتياطية');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.players||!x.attendance)throw 0;db=x;saveDB();render();toast('تم استرجاع النسخة')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function resetDemo(){if(!confirm('ده هيرجع بيانات التجربة الافتراضية ويمسح التعديلات الحالية على الجهاز. تكمل؟'))return;db=JSON.parse(JSON.stringify(initial));saveDB();render();toast('تمت إعادة البيانات')}
function exportMonthlyCSV(){let month=document.getElementById('reportMonth')?.value||today().slice(0,7);let players=session?.role==='manager'?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let lines=[['الشهر','اللاعب','الفريق','أيام الحضور','أيام الغياب','أيام الاعتذار','تواريخ الغياب']];players.forEach(p=>{let entries=Object.entries(db.attendance).map(([key,v])=>{let parts=key.split('_'),pid=parts.pop(),date=parts.join('_');return {pid,date,status:v.status};}).filter(e=>e.pid===p.id&&e.date.startsWith(month));let pr=entries.filter(e=>e.status==='present').length,ab=entries.filter(e=>e.status==='absent').length,ex=entries.filter(e=>e.status==='excused').length;lines.push([month,p.name,teamById(p.teamId)?.name||'',pr,ab,ex,entries.filter(e=>e.status==='absent').map(e=>e.date).sort().join('، ')])});let csv='\ufeff'+lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'monthly-attendance-'+month+'.csv')}
function exportCSV(){let lines=[['اللاعب','الفريق','التاريخ','الحالة']];Object.entries(db.attendance).forEach(([key,v])=>{let parts=key.split('_'),pid=parts.pop(),date=parts.join('_'),p=db.players.find(x=>x.id===pid);if(p&&(!session||session.role==='manager'||p.teamId===coach()?.teamId))lines.push([p.name,teamById(p.teamId)?.name||'',date,v.status==='present'?'حاضر':v.status==='absent'?'غائب':'معتذر'])});let csv='\ufeff'+lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'attendance-report.csv')}
async function download(blob,name){
 try {
  if (window.AndroidFileBridge && typeof window.AndroidFileBridge.saveFile === 'function') {
   const dataUrl = await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});
   const base64 = String(dataUrl).split(',')[1] || '';
   window.AndroidFileBridge.saveFile(name, blob.type || 'text/csv', base64);
   toast('اختار مكان حفظ التقرير من النافذة اللي هتظهر');
   return;
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
 } catch(e) { console.error(e); toast('تعذّر تنزيل الملف. جرّب مرة أخرى.'); }
}

render();
</script>
</body>
