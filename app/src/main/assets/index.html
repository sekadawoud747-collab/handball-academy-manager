<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>Handball Academy Manager</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
:root{--navy:#102a43;--blue:#1f6feb;--pale:#eaf2f8;--bg:#f3f6fa;--ink:#142333;--muted:#64748b;--green:#16845b;--red:#c0392b;--amber:#a96500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--navy);color:white}.secondary{background:var(--pale);color:var(--navy)}.danger{background:#feeceb;color:var(--red)}.success{background:#e4f6ee;color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.appbar{background:var(--navy);color:white;padding:18px 16px 24px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.ball{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:30px;overflow:hidden}.ball.logo-ball img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.appbar h1{font-size:18px;margin:0}.appbar p{font-size:12px;margin:4px 0 0;color:#d6e4f0}.appbar .topline{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #102a430c}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f7f9fc;border:1px solid #edf1f5;border-radius:14px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:11px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf0;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:150px;background:transparent;color:var(--muted);font-size:12px;padding:8px 3px}.nav button.active{background:var(--pale);color:var(--navy)}.player{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.player:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-weight:800;color:var(--navy)}.playerinfo{flex:1;min-width:0}.playerinfo strong{display:block;font-size:14px}.playerinfo small{color:var(--muted)}.statusbtn{padding:8px 9px;font-size:12px;min-width:67px}.present{background:#e3f6ed;color:var(--green)}.absent{background:#ffebea;color:var(--red)}.excused{background:#fff2d9;color:var(--amber)}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#edf2f7;font-size:11px;color:var(--navy)}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.hidden{display:none!important}.notice{background:#fff5d9;border:1px solid #f5df9d;color:#795000;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.6}.login{max-width:430px;margin:28px auto;padding:0 16px}.login .card{padding:22px}.loginlogo{text-align:center;padding:18px 0}.loginlogo .ball{margin:0 auto 10px;width:72px;height:72px;font-size:42px}.loginlogo h1{font-size:21px;margin:0}.loginlogo p{margin:5px;color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{margin:0}.reportrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}.reportrow:last-child{border:0}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:20;background:#142333;color:white;border-radius:12px;padding:13px;text-align:center;box-shadow:0 8px 30px #0002}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
@media(min-width:600px){.wrap{padding-top:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.appbar{padding-left:max(20px,calc((100% - 730px)/2));padding-right:max(20px,calc((100% - 730px)/2))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='ham_v2_data', SESSION='ham_v2_session';
const initial={teams:[{id:'t1',name:'مواليد 2015 بنين',coachId:'c1'},{id:'t2',name:'مواليد 2014 بنات',coachId:'c2'}],coaches:[{id:'c1',name:'كابتن أحمد',phone:'01000000001',password:'1234',teamId:'t1'},{id:'c2',name:'كابتن منى',phone:'01000000002',password:'1234',teamId:'t2'}],players:[{id:'p1',name:'محمد أحمد',teamId:'t1',number:'7'},{id:'p2',name:'عمر محمود',teamId:'t1',number:'10'},{id:'p3',name:'يوسف علي',teamId:'t1',number:'11'},{id:'p4',name:'سلمى حسن',teamId:'t2',number:'4'},{id:'p5',name:'ملك أحمد',teamId:'t2',number:'8'}],attendance:{},manager:{phone:'01000000000',password:'1234'}};
let db=loadDB(), session=JSON.parse(localStorage.getItem(SESSION)||'null'), tab='home', chosenTeam='', chosenDate=today();
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.teams?d:structuredClone(initial)}catch(e){return JSON.parse(JSON.stringify(initial))}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function today(){return new Date().toLocaleDateString('en-CA')}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function teamById(tid){return db.teams.find(t=>t.id===tid)}
function coach(){return db.coaches.find(c=>c.id===session?.id)}
function visibleTeams(){return session?.role==='manager'?db.teams:db.teams.filter(t=>t.id===coach()?.teamId)}
function visiblePlayers(tid){return db.players.filter(p=>p.teamId===tid)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
function login(phone,password,role){let found=role==='manager'?(phone===db.manager.phone&&password===db.manager.password?{id:'manager',name:'المدير',role:'manager'}:null):db.coaches.find(c=>c.phone===phone&&c.password===password)?{...db.coaches.find(c=>c.phone===phone&&c.password===password),role:'coach'}:null;if(!found){toast('رقم الموبايل أو كلمة المرور غير صحيحة');return}session=found;localStorage.setItem(SESSION,JSON.stringify(session));tab='home';render()}
function logout(){session=null;localStorage.removeItem(SESSION);render()}

function homePage(teams,isManager){let todayKey=today();let allPlayers=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let statuses=allPlayers.map(p=>db.attendance[`${todayKey}_${p.id}`]?.status);let present=statuses.filter(s=>s==='present').length,absent=statuses.filter(s=>s==='absent').length,excused=statuses.filter(s=>s==='excused').length;return `<div class="grid"><div class="stat"><strong>${teams.length}</strong><span>الفرق المسؤولة عنها</span></div><div class="stat"><strong>${allPlayers.length}</strong><span>إجمالي اللاعبين</span></div><div class="stat"><strong>${present}</strong><span>حاضر اليوم</span></div><div class="stat"><strong>${absent}</strong><span>غائب اليوم</span></div></div><div class="card"><div class="sectionhead"><h2>تسجيل الحضور</h2><span class="pill">${esc(todayKey)}</span></div><p class="muted small">اختار الفريق وسجّل حالة كل لاعب في ثواني.</p><div class="field"><label>الفريق</label><select id="homeTeam" onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===chosenTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><button class="primary" style="width:100%" onclick="tab='attendance';chosenDate=today();render()">فتح سجل الحضور</button></div><div class="card"><h2>ملخص اليوم</h2><div class="reportrow"><span>حاضر</span><strong style="color:var(--green)">${present}</strong></div><div class="reportrow"><span>غائب</span><strong style="color:var(--red)">${absent}</strong></div><div class="reportrow"><span>معتذر</span><strong style="color:var(--amber)">${excused}</strong></div><div class="reportrow"><span>لم يتم تحديد الحالة</span><strong>${statuses.filter(s=>!s).length}</strong></div></div><div class="notice">ملاحظة: دي نسخة محلية للتجربة. بياناتها موجودة على نفس الجهاز والمتصفح، وليست متزامنة بين أجهزة الكباتن حتى الآن.</div>`}
function attendancePage(teams){if(!teams.length)return `<div class="card empty">مفيش فريق مخصص للحساب ده.</div>`;let team=teamById(chosenTeam)||teams[0];chosenTeam=team.id;let players=visiblePlayers(team.id);return `<div class="card"><div class="sectionhead"><h2>سجل الحضور</h2><span class="pill">${players.length} لاعب</span></div><div class="field"><label>الفريق</label><select onchange="chosenTeam=this.value;render()">${teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>تاريخ التمرين</label><input type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()"></div><div class="row"><button class="secondary" onclick="markAll('present')">الكل حاضر</button><button class="secondary" onclick="clearDay()">مسح الحالات</button></div>${players.length?players.map((p,i)=>{let s=db.attendance[`${chosenDate}_${p.id}`]?.status;return `<div class="player"><div class="avatar">${esc(p.number||String(i+1))}</div><div class="playerinfo"><strong>${esc(p.name)}</strong><small>${s==='present'?'حاضر':s==='absent'?'غائب':s==='excused'?'معتذر':'لم تُحدد الحالة'}</small></div><button class="statusbtn ${s==='present'?'present':''}" onclick="setStatus('${p.id}','present')">حاضر</button><button class="statusbtn ${s==='absent'?'absent':''}" onclick="setStatus('${p.id}','absent')">غائب</button><button class="statusbtn ${s==='excused'?'excused':''}" onclick="setStatus('${p.id}','excused')">معتذر</button></div>`}).join(''):`<div class="empty">مفيش لاعبين في الفريق ده. المدير يقدر يضيفهم من صفحة الفرق.</div>`}<button class="primary" style="width:100%;margin-top:14px" onclick="saveAttendance()">حفظ الحضور</button></div>`}
function setStatus(pid,status){db.attendance[`${chosenDate}_${pid}`]={status,updatedAt:new Date().toISOString(),teamId:chosenTeam};saveDB();render()}
function markAll(s){visiblePlayers(chosenTeam).forEach(p=>db.attendance[`${chosenDate}_${p.id}`]={status:s,updatedAt:new Date().toISOString(),teamId:chosenTeam});saveDB();render();toast('تم تحديد الحالات')}

function teamsPage(){return `<div class="card"><h2>إدارة الفرق واللاعبين</h2><p class="muted small">أضف فريق أو لاعب، ثم عيّن الكابتن المسؤول عن الفريق.</p><div class="field"><label>اسم الفريق الجديد</label><input id="newTeamName" placeholder="مثال: مواليد 2016 بنين"></div><button class="primary" onclick="addTeam()">إضافة فريق</button></div><div class="card"><h2>الفرق الحالية</h2>${db.teams.map(t=>`<div class="reportrow" style="align-items:center"><div><strong>${esc(t.name)}</strong><div class="small muted">${visiblePlayers(t.id).length} لاعب · ${esc(db.coaches.find(c=>c.id===t.coachId)?.name||'بدون كابتن')}</div></div><button class="secondary" onclick="chosenTeam='${t.id}';tab='teams';renderAddPlayer('${t.id}')">إضافة لاعب</button></div>`).join('')||'<div class="empty">لسه مفيش فرق</div>'}</div><div class="card"><h2>إضافة لاعب</h2><div class="field"><label>الفريق</label><select id="playerTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>اسم اللاعب</label><input id="playerName" placeholder="الاسم بالكامل"></div><div class="field"><label>رقم اللاعب (اختياري)</label><input id="playerNumber" inputmode="numeric" placeholder="رقم القميص"></div><button class="primary" onclick="addPlayer()">حفظ اللاعب</button></div><div class="card"><h2>حسابات الكباتن</h2><div class="field"><label>اسم الكابتن</label><input id="coachName" placeholder="اسم الكابتن"></div><div class="field"><label>رقم الموبايل</label><input id="coachPhone" inputmode="tel" placeholder="رقم الموبايل"></div><div class="field"><label>كلمة مرور مؤقتة</label><input id="coachPassword" placeholder="٤ أرقام أو أكثر"></div><div class="field"><label>الفريق المسؤول عنه</label><select id="coachTeam">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button class="primary" onclick="addCoach()">إنشاء حساب كابتن</button><p class="small muted">الحسابات هنا تجريبية ومحفوظة محليًا فقط، فلا تستخدم كلمات مرور حقيقية.</p>${db.coaches.map(c=>`<div class="reportrow"><span>${esc(c.name)}<br><small class="muted">${esc(c.phone)} · ${esc(teamById(c.teamId)?.name||'بدون فريق')}</small></span><button class="danger" onclick="deleteCoach('${c.id}')">حذف</button></div>`).join('')}</div>`}
function renderAddPlayer(tid){render()}
function addTeam(){let name=document.getElementById('newTeamName').value.trim();if(!name)return toast('اكتب اسم الفريق');db.teams.push({id:id(),name,coachId:''});saveDB();render();toast('تمت إضافة الفريق')}
function addPlayer(){let name=document.getElementById('playerName').value.trim(),teamId=document.getElementById('playerTeam').value,number=document.getElementById('playerNumber').value.trim();if(!name||!teamId)return toast('اكتب اسم اللاعب واختار الفريق');db.players.push({id:id(),name,teamId,number});saveDB();render();toast('تمت إضافة اللاعب')}
function addCoach(){let name=document.getElementById('coachName').value.trim(),phone=document.getElementById('coachPhone').value.trim(),password=document.getElementById('coachPassword').value.trim(),teamId=document.getElementById('coachTeam').value;if(!name||!phone||password.length<4||!teamId)return toast('كمّل بيانات الكابتن');if(db.coaches.some(c=>c.phone===phone)||phone===db.manager.phone)return toast('رقم الموبايل مستخدم بالفعل');let c={id:id(),name,phone,password,teamId};db.coaches.push(c);let t=teamById(teamId);if(t)t.coachId=c.id;saveDB();render();toast('تم إنشاء حساب الكابتن')}
function deleteCoach(cid){if(!confirm('تحذف حساب الكابتن؟'))return;db.coaches=db.coaches.filter(c=>c.id!==cid);db.teams.forEach(t=>{if(t.coachId===cid)t.coachId=''});saveDB();render()}
function reportsPage(teams,isManager){let players=isManager?db.players:db.players.filter(p=>p.teamId===coach()?.teamId);let total=0;let rows=players.map(p=>{let entries=Object.entries(db.attendance).filter(([k,v])=>k.endsWith('_'+p.id));let pr=entries.filter(([k,v])=>v.status==='present').length,ab=entries.filter(([k,v])=>v.status==='absent').length,ex=entries.filter(([k,v])=>v.status==='excused').length;total+=entries.length;return `<div class="reportrow"><div><strong>${esc(p.name)}</strong><div class="small muted">${esc(teamById(p.teamId)?.name||'')}</div><div class="small">حاضر ${pr} · غائب ${ab} · معتذر ${ex}</div></div><strong>${entries.length?Math.round(pr/entries.length*100):0}%</strong></div>`});return `<div class="card"><h2>تقارير الحضور</h2><div class="grid"><div class="stat"><strong>${players.length}</strong><span>لاعب</span></div><div class="stat"><strong>${total}</strong><span>سجلات حالات</span></div></div>${rows.join('')||'<div class="empty">لا توجد بيانات بعد</div>'}<button class="primary" style="width:100%;margin-top:12px" onclick="exportCSV()">تصدير تقرير Excel (.xlsx)</button></div>`}
function settingsPage(){return `<div class="card"><h2>الإعدادات والنسخ الاحتياطي</h2><p class="muted">احفظ نسخة احتياطية من بيانات التجربة، أو استرجع نسخة محفوظة قبل كده.</p><button class="primary" style="width:100%" onclick="backup()">تنزيل نسخة احتياطية</button><div class="field"><label>استرجاع نسخة JSON</label><input type="file" id="restoreFile" accept=".json,application/json" style="display:block;width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:11px;background:#fff;color:var(--ink)" onchange="document.getElementById('restoreName').textContent=this.files?.[0]?.name||'لم يتم اختيار ملف'">
<div id="restoreName" class="small muted">لم يتم اختيار ملف</div></div><button class="secondary" style="width:100%" onclick="restore()">استرجاع البيانات</button><button class="danger" style="width:100%;margin-top:10px" onclick="resetDemo()">إعادة بيانات التجربة الافتراضية</button><div class="notice" style="margin-top:14px">النسخة الحالية تعمل بدون إنترنت بعد فتحها، لكن كل جهاز له بياناته. النسخة النهائية تحتاج خادمًا آمنًا لتزامن الحضور بين المدير والكباتن.</div><p class="foot">Handball Academy Manager · إصدار تجريبي 2</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'handball-backup.json')}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return toast('اختار ملف النسخة الاحتياطية');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.players||!x.attendance)throw 0;db=x;saveDB();render();toast('تم استرجاع النسخة')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function resetDemo(){if(!confirm('ده هيرجع بيانات التجربة الافتراضية ويمسح التعديلات الحالية على الجهاز. تكمل؟'))return;db=JSON.parse(JSON.stringify(initial));saveDB();render();toast('تمت إعادة البيانات')}
function exportCSV(){
  const allowedPlayers = db.players.filter(p => !session || session.role === 'manager' || p.teamId === coach()?.teamId);
  const now = new Date();
  const monthInput = prompt('اكتب الشهر المطلوب بصيغة YYYY-MM، أو اتركه فارغًا لتصدير كل الشهور:', now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  if (monthInput === null) return;
  const selectedMonth = monthInput.trim();
  if (selectedMonth && !/^\d{4}-\d{2}$/.test(selectedMonth)) return toast('اكتب الشهر بالشكل 2026-10');
  const records=[];
  Object.entries(db.attendance || {}).forEach(([key,v]) => {
    const player=allowedPlayers.find(x=>key.endsWith('_'+x.id)); if(!player) return;
    const date=key.slice(0, key.length-player.id.length-1);
    const month=String(date).slice(0,7); if(selectedMonth && month!==selectedMonth) return;
    records.push({player,team:teamById(player.teamId)?.name||'بدون فريق',date,month,status:v.status});
  });
  const monthly=[['حصر الحضور والغياب الشهري'],['الشهر',selectedMonth||'كل الشهور'],[],['الفريق','اسم اللاعب','عدد مرات الحضور','عدد مرات الغياب','عدد مرات الاعتذار','إجمالي مرات التسجيل']];
  const teams=visibleTeams().filter(t=>allowedPlayers.some(p=>p.teamId===t.id));
  teams.forEach(team=>{
    const teamPlayers=allowedPlayers.filter(p=>p.teamId===team.id).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    const teamRows=teamPlayers.map(player=>{
      const rr=records.filter(r=>r.player.id===player.id);
      return {team:team.name,player:player.name,present:rr.filter(r=>r.status==='present').length,absent:rr.filter(r=>r.status==='absent').length,excused:rr.filter(r=>r.status==='excused').length,total:rr.length};
    });
    monthly.push([team.name,'','','','','']);
    teamRows.forEach(r=>monthly.push([r.team,r.player,r.present,r.absent,r.excused,r.total]));
    monthly.push(['','','','','','']);
  });
  const details=[['تفاصيل الحضور'],['اللاعب','الفريق','التاريخ','الشهر','الحالة']];
  const statusLabel=s=>s==='present'?'حاضر':s==='absent'?'غائب':s==='excused'?'معتذر':'غير محدد';
  records.sort((a,b)=>a.team.localeCompare(b.team,'ar')||a.player.name.localeCompare(b.player.name,'ar')||a.date.localeCompare(b.date));
  records.forEach(r=>details.push([r.player.name,r.team,r.date,r.month,statusLabel(r.status)]));
  const xmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const colName=n=>{let out='';while(n){let r=(n-1)%26;out=String.fromCharCode(65+r)+out;n=Math.floor((n-1)/26)}return out};
  const sheetXml=rows=> '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetData>'+rows.map((row,ri)=>'<row r="'+(ri+1)+'">'+row.map((v,ci)=>{const ref=colName(ci+1)+(ri+1);if(typeof v==='number')return '<c r="'+ref+'"><v>'+v+'</v></c>';return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const files={
    '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
    '_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="الحصر الشهري" sheetId="1" r:id="rId1"/><sheet name="تفاصيل الحضور" sheetId="2" r:id="rId2"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/></Relationships>',
    'xl/worksheets/sheet1.xml':sheetXml(monthly),
    'xl/worksheets/sheet2.xml':sheetXml(details)
  };
  createXlsxBlob(files).then(blob=>download(blob,'handball-monthly-report.xlsx')).catch(()=>toast('تعذر إنشاء ملف Excel'));
}
async function createXlsxBlob(files){
  const enc=new TextEncoder(); const crcTable=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);crcTable[n]=c>>>0;}
  const crc32=bytes=>{let c=0xffffffff;for(let i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&255]^(c>>>8);return (c^0xffffffff)>>>0};
  const chunks=[],central=[];let offset=0;
  const put16=(v)=>{const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,v,true);return a};
  const put32=(v)=>{const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,v>>>0,true);return a};
  const join=arr=>{let len=arr.reduce((n,a)=>n+a.length,0),out=new Uint8Array(len),pos=0;arr.forEach(a=>{out.set(a,pos);pos+=a.length});return out};
  for(const [name,content] of Object.entries(files)){
    const nb=enc.encode(name), data=enc.encode(content), crc=crc32(data);
    const local=join([put32(0x04034b50),put16(20),put16(0x0800),put16(0),put16(0),put16(0),put32(crc),put32(data.length),put32(data.length),put16(nb.length),put16(0),nb,data]);chunks.push(local);
    const dir=join([put32(0x02014b50),put16(20),put16(20),put16(0x0800),put16(0),put16(0),put16(0),put32(crc),put32(data.length),put32(data.length),put16(nb.length),put16(0),put16(0),put16(0),put16(0),put32(0),put32(offset),nb]);central.push(dir);offset+=local.length;
  }
  const centralBytes=join(central),end=join([put32(0x06054b50),put16(0),put16(0),put16(central.length),put16(central.length),put32(centralBytes.length),put32(offset),put16(0)]);
  return new Blob([...chunks,centralBytes,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function download(blob,name){
  if(window.AndroidFileBridge && typeof window.AndroidFileBridge.saveFile==='function'){
    const reader=new FileReader();
    reader.onloadend=function(){
      try{const base64=String(reader.result).split(',')[1];window.AndroidFileBridge.saveFile(name,blob.type||'application/octet-stream',base64)}
      catch(e){toast('تعذّر فتح نافذة حفظ الملف')}
    };
    reader.onerror=function(){toast('تعذّر تجهيز الملف')}; reader.readAsDataURL(blob); return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
